{% extends 'base.html' %}
{% from '_icons.html' import icon %}

{% block page_title %}Page not found{% endblock %}

{% block content %}
<section class="card empty-state empty-state--page">
  <span class="empty-icon">{{ icon('search') }}</span>
  <h2>That page isn't on the shelf.</h2>
  <p>The link may be out of date, or the book may have been removed.</p>
  <a class="btn btn-primary" href="{{ url_for('dashboard.index') }}">Go to dashboard</a>
</section>
{% endblock %}
