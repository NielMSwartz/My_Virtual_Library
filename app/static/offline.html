<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#78917B">
  <title>Offline · Bookshelf</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #25282D;
      --muted: #747B86;
      --sage: #78917B;
      --surface: #FFFFFF;
      --canvas: #F1F2F4;
      --line: #E0E3E7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--canvas);
      color: var(--ink);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .card {
      width: min(100%, 420px);
      padding: 36px 32px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(37, 40, 45, 0.06);
      text-align: center;
    }
    .mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: var(--sage);
    }
    .mark svg { width: 34px; height: 34px; fill: none; stroke: #fff; stroke-width: 1.8; }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    p { margin: 0 0 24px; color: var(--muted); }
    button {
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 12px 22px;
      background: var(--sage);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:focus-visible { outline: 3px solid #D9C9B4; outline-offset: 2px; }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #F1F2F4;
        --muted: #A0A8B2;
        --sage: #8FAE93;
        --surface: #22262B;
        --canvas: #171A1E;
        --line: #343A41;
      }
      .card { box-shadow: 0 18px 50px rgba(0, 0, 0, .45); }
      button { color: #12201A; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 6.5C9.6 4.9 6.6 4.6 3.5 5.2v12c3.1-.6 6.1-.3 8.5 1.3 2.4-1.6 5.4-1.9 8.5-1.3v-12c-3.1-.6-6.1-.3-8.5 1.3Z"/>
        <path d="M12 6.5v12"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>Your library needs a connection for fresh data. Reconnect and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
